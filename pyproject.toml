[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theo-core"
dynamic = ["version"]
description = "THEO — The Poet: A cognitive operating system for exploring artificial cognition, memory, creativity, reasoning, and identity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "THEO Contributors" }]
keywords = ["ai", "cognition", "research", "transformer", "memory"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.10",
    "structlog>=25.0",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.10", "wandb>=0.18"]
torch = ["torch>=2.4", "numpy>=2.0"]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.0",
    "pre-commit>=4.0",
    "factory-boy>=3.3",
    "types-PyYAML>=6.0",
]

[project.scripts]
theo = "theo_core.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/theo_core"]

[tool.hatch.version]
path = "src/theo_core/_version.py"

# ---------- Ruff ----------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate (commented-out code)
]
ignore = [
    "D100",  # Missing docstring in public module (READMEs suffice)
    "D104",  # Missing docstring in public package
    "D203",  # 1 blank line before class docstring (conflicts with D212)
    "D213",  # Multi-line summary second line (conflicts with D212)
    "S101",  # Use of assert (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["theo_core"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mlflow.*", "wandb.*", "yaml.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers --tb=short --cov=theo_core --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

# ---------- Coverage ----------
[tool.coverage.run]
source = ["theo_core"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "pass",
    "@abstractmethod",
    "raise NotImplementedError",
]
